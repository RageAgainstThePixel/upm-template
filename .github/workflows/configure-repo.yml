name: configure-repo
on:
  push:
    branches: ['main']
permissions:
  contents: read
jobs:
  add-discord-hook:
    # only public com.utilities packages post to the upm release channel
    if: ${{ !github.event.repository.is_template && !github.event.repository.private && startsWith(github.event.repository.name, 'com.utilities.') }}
    uses: RageAgainstThePixel/workflows/.github/workflows/add-discord-hook.yml@main
    secrets:
      token: ${{ secrets.CI_TOKEN }}
      discord-webhook: ${{ secrets.UPM_RELEASE_DISCORD_WEBHOOK }}
